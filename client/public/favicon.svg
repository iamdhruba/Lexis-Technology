<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Box -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Geometric Modern 'L' Mark -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <path d="M18 15 H27 V41 H18 Z" fill="url(#lGrad)" />
    <!-- Horizontal base -->
    <path d="M18 35 H44 V44 H18 Z" fill="url(#lGrad)" />
    <!-- Modern cyan accent tip -->
    <path d="M36 35 L46 35 L42 44 L32 44 Z" fill="url(#cyanGrad)" />
    <!-- Tech node indicator -->
    <circle cx="44" cy="20" r="3.5" fill="#38bdf8" />
    <path d="M44 14 V17 M44 23 V26 M38 20 H41 M47 20 H50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>

